# TrackFlow site config. Installed to /etc/nginx/sites-available/trackflow by
# server_deploy.sh, which replaces __ORIGIN_SECRET__ with ORIGIN_SECRET from the .env.
#
# Traffic path: browser --HTTPS--> CloudFront --HTTP:80--> nginx --> gunicorn (127.0.0.1:8000)

# Log $uri (no query string): WebSocket URLs carry the JWT as ?token=...
log_format trackflow '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent" '
                     'xff="$http_x_forwarded_for"';

upstream trackflow_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/trackflow.access.log trackflow;
    error_log  /var/log/nginx/trackflow.error.log warn;

    client_max_body_size 25m;
    server_tokens off;

    # Only CloudFront knows this value, so requests that bypass CloudFront are refused.
    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    location /static/ {
        alias /srv/trackflow/shared/static/;
        expires 7d;
        access_log off;
    }

    # User uploads are served from the app's own origin, so lock them down: never sniff
    # types and never let an uploaded HTML/SVG file run script.
    location /media/ {
        alias /srv/trackflow/shared/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location /ws/ {
        proxy_pass http://trackflow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://trackflow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CloudFront only talks to browsers over HTTPS (it redirects http -> https).
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
